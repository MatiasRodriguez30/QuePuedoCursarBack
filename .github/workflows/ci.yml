# Controles automáticos de cada PR y de cada push a main.
# La protección de la rama main exige que estos jobs pasen antes de mergear.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests-py38:
    # Misma versión de Python que la tablet de producción: si algo no corre
    # en 3.8 (asyncio.to_thread, "X | None", list[int], etc.), falla acá y no allá.
    name: Tests en Python 3.8 (tablet)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Compilar todo el código con Python 3.8
        run: python -m compileall -q app deploy scripts tests
      - name: Tests
        run: python -m pytest -q

  tests-actual:
    name: Tests en Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q

  secretos:
    name: Busqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagen-docker:
    name: Imagen Docker (servidor casero)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar compose.yml
        run: touch .env && docker compose config -q
      - name: Construir la imagen
        run: docker build -t qpc-api .
      - name: Arrancarla y comprobar que responde
        run: |
          mkdir data && chmod 777 data
          docker run -d --name qpc -p 8000:8000 -v "$PWD/data:/data" qpc-api
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/openapi.json && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/openapi.json | python3 -c "import json,sys; print(len(json.load(sys.stdin)['paths']), 'rutas')"
          docker logs qpc | tail -20
          test -f data/plan_estudios.db  # la base se creó en el volumen, no en la imagen
